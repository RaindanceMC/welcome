# Rain's Welcome — every line it says. Override any of them in plugins/RainsCore/messages.yml.
welcome:
  title: "<gradient:#F6B83D:#F2843A><bold>Welcome to Hyades</bold></gradient>"
  subtitle: "<#6EC1EA>Your adventure starts here"
  window-title: "Welcome to Hyades"
  window-text: "<white>Glad you found us!</white>\n\n<gray>Hyades is a survival world with guilds, jobs, skills, shops and a lot more to discover.</gray>\n\n<gray>Press the button when you are ready — you can also type <white>/skip</white> at any time.</gray>"
  button-go: "Take me to Hyades"
  button-go-hint: "Off to the survival world"
  chat-hint: "<gray>Ready? <white>/skip</white> takes you to Hyades at any time.</gray>"
  going: "<#6EC1EA>Taking you to Hyades…"
  not-moved: "<yellow>Hyades did not take you just now — it may be restarting. Try <white>/skip</white> again in a moment.</yellow>"
  nowhere: "<red>There is nowhere to send you yet — staff have to set the next server first.</red>"
  only-a-player: "<red>Only a player can do that.</red>"
  status-welcome: "<gray>You are welcomed here like a newcomer and sent on when you choose.</gray>"
  status-stay: "<gray>You may stay here: staff and builders are never welcomed or sent on.</gray>"
  status-off: "<gray>The welcome is switched off, or no next server is set.</gray>"
  usage: "<gray>/welcome preview <dark_gray>— the welcome as a newcomer gets it · <gray>/welcome status"
  intro-skip: "<gray>Sneak to skip the intro"
  intro-skip-credit: "<gray>Sneak to skip the intro <dark_gray>·</dark_gray> <dark_gray><credit>"
  intro-caption: "<gradient:#F6B83D:#F2843A><bold><caption></bold></gradient>"
  intro-subcaption: "<#6EC1EA><caption>"
  intro-none: "<yellow>There is no intro yet — record at least two shots with <white>/intro shot add</white>.</yellow>"
  intro-over: "<gray>That was the intro.</gray>"
  intro-added: "<green>Shot <white><number></white> recorded where you stand and look.</green>"
  intro-empty: "<gray>No shots yet. <white>/intro shot add <caption></white> records where you stand and look.</gray>"
  intro-line: "<gray><white><number>.</white> <world> <x> <y> <z> <dark_gray>·</dark_gray> <white><caption></white></gray>"
  intro-removed: "<green>Shot removed.</green>"
  intro-moved: "<green>Shot moved.</green>"
  intro-no-such: "<red>There is no such shot — see <white>/intro shot list</white>.</red>"
  intro-usage: "<gray>/intro shot add <caption> <dark_gray>— \"Title | subtitle\" · <gray>/intro shot list · remove <n> · move <from> <to> · /intro play"
