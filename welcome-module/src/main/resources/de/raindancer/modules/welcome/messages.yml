# Rain's Welcome — every line it says. Override any of them in plugins/RainsCore/messages.yml.
welcome:
  title: "<gradient:#F6B83D:#F2843A><bold>Welcome to Hyades</bold></gradient>"
  subtitle: "<#6EC1EA>Your adventure starts here"
  window-title: "Welcome to Hyades"
  window-text: "<white>Glad you found us!</white>\n\n<gray>Hyades is a survival world with guilds, jobs, skills, shops and a lot more to discover.</gray>\n\n<gray>Press the button when you are ready — you can also type <white>/skip</white> at any time.</gray>"
  button-go: "Take me to Hyades"
  button-go-hint: "Off to the survival world"
  button-tour: "Show me around first"
  button-tour-hint: "A short tour of the island with a guide"
  chat-hint: "<gray>Ready? <white>/skip</white> takes you to Hyades at any time.</gray>"
  going: "<#6EC1EA>Taking you to Hyades…"
  not-moved: "<yellow>Hyades did not take you just now — it may be restarting. Try <white>/skip</white> again in a moment.</yellow>"
  nowhere: "<red>There is nowhere to send you yet — staff have to set the next server first.</red>"
  only-a-player: "<red>Only a player can do that.</red>"
  status-welcome: "<gray>You are welcomed here like a newcomer and sent on when you choose.</gray>"
  status-stay: "<gray>You may stay here: staff and builders are never welcomed or sent on.</gray>"
  status-off: "<gray>The welcome is switched off, or no next server is set.</gray>"
  usage: "<gray>/welcome preview <dark_gray>— the welcome as a newcomer gets it · <gray>/welcome status"
  intro-skip: "<gray>Sneak to skip the intro"
  intro-skip-credit: "<gray>Sneak to skip the intro <dark_gray>·</dark_gray> <dark_gray><credit>"
  intro-caption: "<gradient:#F6B83D:#F2843A><bold><caption></bold></gradient>"
  intro-subcaption: "<#6EC1EA><caption>"
  intro-none: "<yellow>There is no intro yet — record at least two shots with <white>/intro shot add</white>.</yellow>"
  intro-over: "<gray>That was the intro.</gray>"
  intro-added: "<green>Shot <white><number></white> recorded where you stand and look.</green>"
  intro-empty: "<gray>No shots yet. <white>/intro shot add <caption></white> records where you stand and look.</gray>"
  intro-line: "<gray><white><number>.</white> <world> <x> <y> <z> <dark_gray>·</dark_gray> <white><caption></white></gray>"
  intro-removed: "<green>Shot removed.</green>"
  intro-moved: "<green>Shot moved.</green>"
  intro-no-such: "<red>There is no such shot — see <white>/intro shot list</white>.</red>"
  intro-usage: "<gray>/intro shot add <caption> <dark_gray>— \"Title | subtitle\" · <gray>/intro shot list · remove <n> · move <from> <to> · /intro play"
  trailer-going: "<#6EC1EA>Off to the trailer…"
  tutorial-going: "<#6EC1EA>Off to the tour with your guide…"
  trailer-none: "<yellow>There is no trailer yet.</yellow>"
  trailer-over: "<gray>That was the trailer. <white>/skip</white> takes you back to Hyades.</gray>"
  only-on-welcome: "<red>That only works on the welcome server.</red>"
  tutorial-guide-name: "<#F6B83D><bold><name></bold></#F6B83D> <gray>· your guide"
  tutorial-hello-bubble: "<white>Hi there!</white>"
  tutorial-hello-title: "Hi, I'm <name>!"
  tutorial-hello-text: "<white>Welcome to the island!</white>\n\n<gray>I'll walk you round and show you the most important things on Hyades — just follow me. At each stop you can try it yourself.</gray>\n\n<dark_gray>/tutorial next skips a stop · /skip ends the tour and takes you to Hyades</dark_gray>"
  tutorial-here-bubble: "<white>Here we are!</white>"
  tutorial-stop-trail: "Stop <number> of <total>"
  tutorial-guide-line: "<#F6B83D><name></#F6B83D> <gray>says:</gray>"
  tutorial-button-go: "Let's go!"
  tutorial-button-go-hint: "Follow your guide to the first stop"
  tutorial-button-try: "Let me try"
  tutorial-button-next: "Next stop"
  tutorial-button-next-hint: "Skip this one"
  tutorial-button-end: "End the tour"
  tutorial-button-end-hint: "You can start it again with /tutorial"
  tutorial-follow: "<white>Follow me!</white>\n<gray>Next: <station></gray>"
  tutorial-try: "<#6EC1EA>Your turn: <white><hint></white> <dark_gray>·</dark_gray> <gray>/tutorial next skips it"
  tutorial-done-step: "<green>✔ <white><station></white> — well done!</green>"
  tutorial-bar: "<#F6B83D>Tour</#F6B83D> <dark_gray>·</dark_gray> <gray>stop <white><number></white>/<white><total></white> <dark_gray>·</dark_gray> <white><station>"
  tutorial-finished: "<white>That's everything!</white>\n<gray>Have fun on Hyades.</gray>"
  tutorial-finished-title: "You're ready!"
  tutorial-finished-text: "<white>That was the tour.</white>\n\n<gray>Everything you tried here was just practice — on Hyades you start fresh. See you there!</gray>"
  tutorial-not-ready: "<yellow>The tour is not set up yet.</yellow>"
  tutorial-none: "<gray>You are not on the tour. <white>/tutorial</white> starts it.</gray>"
  tutorial-rescued: "<#6EC1EA>Whoa — not that way! Back to the start with you.</#6EC1EA>"
  tutorial-stopped: "<gray>Tour ended. <white>/tutorial</white> starts it again, <white>/skip</white> takes you to Hyades.</gray>"
  tutorial-usage: "<gray>/tutorial <dark_gray>— start the tour · <gray>/tutorial next · /tutorial stop"
  tutorial-start-set: "<green>The tour starts where you stand now.</green>"
  tutorial-island-building: "<gray>Building the tutorial island…</gray>"
  tutorial-island-built: "<green>The tutorial island is built, with its start and every station. <white>/tutorial</white> tries it.</green>"
  tutorial-station-line: "<gray><white><id></white> <x> <y> <z></gray>"
  tutorial-station-unset: "<gray><white><id></white> <dark_gray>— not placed</dark_gray></gray>"
  tutorial-station-set: "<green>Station <white><id></white> is where you stand now.</green>"
  tutorial-station-removed: "<green>Station <white><id></white> taken off the tour.</green>"
  tutorial-no-such: "<red>No such station. Stations: <white><ids></white></red>"
  tutorial:
    economy:
      title: "Money & the shop"
      say1: "Hyades pays in Drachmas. You earn them by selling what you find and doing jobs."
      say2: "Check your purse with /balance, buy and sell at /shop."
      hint: "Try /balance"
    cosmetics:
      title: "Looking good"
      say1: "Make yourself stand out: name colours, particle trails, titles and more."
      say2: "It's all in /cosmetics — have a look!"
      hint: "Open /cosmetics"
    claims:
      title: "Your land"
      say1: "Build without worries: claim your land and nobody can break or take anything there."
      say2: "Stand where you build and type /claim — you can share it with friends later."
      hint: "Try /claim"
    homes:
      title: "Homes"
      say1: "Found a nice place to live? Set it as your home with /sethome."
      say2: "/home brings you back from anywhere, any time."
      hint: "Set one: /sethome"
    travel:
      title: "Getting around"
      say1: "/warp takes you to places everybody can visit, /spawn back here to the start."
      say2: "And /tpa asks a friend to let you teleport to them."
      hint: "Look at /warp"
    jobs:
      title: "Jobs & quests"
      say1: "Every day there are jobs and quests that pay well."
      say2: "/jobs shows what is wanted today."
      hint: "Open /jobs"
    skills:
      title: "Skills"
      say1: "Everything you do makes you better: mining, fighting, farming, fishing…"
      say2: "/skills shows your skill tree and what you can unlock."
      hint: "Open /skills"
    guilds:
      title: "Guilds"
      say1: "Team up! A guild gets shared land, a bank and perks of its own."
      say2: "Found one or join one — it all starts at /guild."
      hint: "Open /guild"
    rules:
      title: "The rules"
      say1: "One last thing: Hyades is friendly, and we keep it that way."
      say2: "Please read the rules with /rules — then you are ready!"
      hint: "Read /rules"
